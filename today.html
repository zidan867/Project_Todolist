<!doctype html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

          <img src="/src/img/settings.png" class="w-8" />

        <a href="#" class="flex gap-7 pb-7">
          <img src="/src/img/help.png" class="w-8" />

        <input

          class="border-3 border-gray-300 outline-none p-2 rounded-xl w-74 px-11 font-['Inter']"

        <a href="#" class="w-7">
          <img src="/src/img/notification.png" />
        </a>

        <div class="flex justify-between items-center gap-5 font-['Inter']">
          <img src="/src/img/profile.png" class="w-7" />

            <img src="/src/img/down-arrow.png" class="w-5" />

      </div>

      <div

      <div

            <img src="/src/img/calendar.png" class="w-6" />

        <div class="flex gap-5 p-6 items-center">

          <img src="/src/img/options.png" class="w-6 h-6" />
          <p class="font-bold">Submit Assignment</p>
          <div
            class="text-[#2C6BF7] font-bold bg-[#E8F1FE] rounded-lg h-full ml-53"

            <p class="p-1 px-5">School</p>

        <div class="flex gap-5 p-6">
          <img src="/src/img/options.png" class="w-6 h-6" />
          <p class="font-bold">Workout</p>
          <div
            class="text-[#2CAB6B] font-bold bg-[#DDF8EE] rounded-lg h-full ml-75"

            <p class="p-1 px-5">Health</p>

          <div class="flex gap-3 ml-85.5">
            <img src="/src/img/calendar.png" class="w-6 h-6" />

          <img src="/src/img/sun.png" class="w-6" />
          <p>Keep going! You’ve got this.</p>
        </div>
