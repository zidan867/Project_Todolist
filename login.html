<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/output.css" />

    <title>Login</title>
  </head>
  <body class="flex min-h-screen">
    <section class="w-1/2">
      <img src="/src/img/f-task.png" class="w-full h-screen object-cover" />
    </section>

    <section class="w-1/2 font-['Inter'] flex flex-col items-center">
      <div class="text-center pt-15">
        <p class="text-4xl font-bold">Welcome!</p>

        <p class="pt-3">Sign in to continue to Task-M</p>
      </div>

      <div class="w-full max-w-md mt-10">
        <div class="mb-7">
          <label class="block text-base font-bold text-gray-800 mb-2">
            Email
          </label>

          <div class="relative">
            <img
              src="/src/img/mail.png"
              class="absolute left-4 top-1/2 -translate-y-1/2 w-5"
            />

            <input
              type="email"
              placeholder="Enter your email"
              class="w-full h-12 pl-12 pr-4 rounded-lg border-2 border-gray-200 outline-none text-sm focus:border-purple-600 focus:ring-1 focus:ring-purple-600"
            />
          </div>
        </div>

        <div class="mb-5">
          <div class="flex justify-between items-center mb-2">
            <label class="text-base font-bold text-gray-800"> Password </label>
            <a href="#" class="text-sm text-purple-600 hover:underline">
              Forgot password?
            </a>
          </div>
          <div class="relative">
            <img
              src="/src/img/padlock (1).png"
              class="absolute left-4 top-1/2 -translate-y-1/2 w-5"
            />

            <input
              type="password"
              placeholder="Enter your password"
              class="w-full h-12 pl-12 pr-12 rounded-lg border-2 border-gray-200 outline-none text-sm focus:border-purple-600 focus:ring-1 focus:ring-purple-600"
            />

            <button
              type="button"
              class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center"
            >
              <img src="/src/img/visible.png" class="w-5 h-5" />
            </button>
          </div>
        </div>

        <label class="flex items-center gap-3 mb-7 cursor-pointer">
          <input type="checkbox" class="w-5 h-5 accent-purple-600" />

          <span class="text-base text-gray-700"> Remember me </span>
        </label>

        <button
          type="submit"
          class="w-full h-12 rounded-lg bg-purple-600 text-white text-base hover:bg-purple-700 transition"
        >
          Sign In
        </button>

        <div class="flex items-center gap-4 my-10">
          <div class="flex-1 h-px bg-gray-400"></div>

          <span class="text-gray-500 whitespace-nowrap"> or sign in with </span>

          <div class="flex-1 h-px bg-gray-400"></div>
        </div>

        <button
          type="button"
          class="w-full h-12 rounded-lg border-2 border-gray-200 flex items-center justify-center gap-4 text-gray-800 font-bold hover:bg-gray-50 transition"
        >
          <img src="/src/img/google (2).png" class="w-5 h-5" />

          <span> Sign in with Google </span>
        </button>
        
        <p class="text-center text-gray-500 mt-6">
          Don't have an account?

          <a href="#" class="text-purple-600 hover:underline"> Sign up now </a>
        </p>
      </div>
    </section>
  </body>
</html>
