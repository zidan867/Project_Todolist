<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/output.css" />
    <script>
      if (localStorage.getItem("taskMLoggedIn") !== "true") {
        window.location.replace("login.html");
      }
    </script>
    <title>Detail Tasks</title>
  </head>
  <body class="flex">
    <section
      class="fixed left-0 top-0 z-50 h-screen w-72 border-r-2 border-gray-300 bg-white"
    >
      <div class="flex items-center justify-center gap-2 p-13">
        <img src="src/img/check.png" class="w-15" />
        <h1 class="text-2xl font-bold font-['Inter']">Task-M</h1>
      </div>

      <div class="ml-8 w-40">
        <a href="dashboard.html" class="flex gap-7 pb-7">
          <img src="src/img/dashboard.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">Dashboard</p>
        </a>
        <a href="myTasks.html" class="flex gap-7 pb-7">
          <img src="src/img/mytasks.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">My Tasks</p>
        </a>
        <a href="today.html" class="flex gap-7 pb-7">
          <img src="src/img/today.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">Today</p>
        </a>
        <a href="upComing.html" class="flex gap-7 pb-7">
          <img src="src/img/upcoming.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">Upcoming</p>
        </a>
        <a href="completed.html" class="flex gap-7 pb-7">
          <img src="src/img/completed.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">Completed</p>
        </a>
      </div>

      <div class="w-65 border-1 border-gray-300 mx-auto"></div>

      <div class="ml-8 w-40">
        <a href="#" class="flex gap-7 pb-7 pt-7">
          <img src="src/img/settings.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">Settings</p>
        </a>
        <a href="#" class="flex gap-7 pb-7">
          <img src="src/img/help.png" class="w-8" />
          <p class="text-lg pt-1 font-bold font-['Inter']">Help</p>
        </a>
      </div>
    </section>

    <div class="h-290 border-2 border-gray-300 ml-72 fixed"></div>

    <section class="ml-72 font-['Inter']">
      <div class="fixed left-72 bg-white mx-1">
        <div class="flex items-center justify-between p-13 mx-13 gap-10 ml-119">
          <img src="src/img/search.png" class="absolute w-5 mx-4" />
          <input
            type="text"
            placeholder="Search Tasks..."
            class="border-3 border-gray-300 outline-none p-2 rounded-xl w-74 px-11 font-['Inter']"
          />
          <a href="#" class="w-7">
            <img src="src/img/notification.png" />
          </a>

          <div class="relative flex items-center gap-5 font-['Inter']">
            <img src="src/img/profile.png" class="w-7" />
            <p class="">Faras Arrobi</p>
            <button id="profile-menu-button" type="button" aria-expanded="false" aria-controls="profile-menu" class="flex items-center">
              <img src="src/img/down-arrow.png" class="w-5" />
            </button>
            <div id="profile-menu" hidden class="absolute right-0 top-full z-10 mt-3 w-56 rounded-lg border border-gray-200 bg-white p-3 shadow-lg">
              <a href="#" class="flex items-center gap-3 rounded-md px-3 py-3 text-base hover:bg-gray-50">
                <img src="src/img/settings.png" class="h-6 w-6" />
                <span>Settings</span>
              </a>
              <button id="logout-button" type="button" class="flex w-full items-center gap-3 rounded-md px-3 py-3 text-left text-base text-red-600 hover:bg-red-50">
                <span aria-hidden="true" class="text-2xl leading-none">&#8618;</span>
                <span>Logout</span>
              </button>
            </div>
          </div>
        </div>

        <div class="mx-13 bg-white">
          <div class="flex gap-5 pt-8">
            <a href="dashboard.html" aria-label="Back to Dashboard">
              <img src="src/img/back 2.png" class="w-5 h-5" />
            </a>
            <p>Back to Dashboard</p>
          </div>
          <div class="flex gap-3 justify-between">
            <h1 class="text-3xl font-bold pt-7">Task Detail</h1>
            <button
              id="edit-task-button"
              type="button"
              class="flex border-3 border-gray-300 p-2 w-27 rounded-lg px-4 font-bold gap-3 mt-5 ml-170"
            >
              <img src="src/img/actions1.png" class="w-5 h-5" />
              <p>Edit</p>
            </button>
            <button
              id="delete-task-button"
              type="button"
              class="flex border-3 border-red-400 p-2 w-33 rounded-lg px-5 font-bold gap-3 mt-5 text-red-500"
            >
              <img src="src/img/delete.png" class="w-5 h-5" />
              <p>Delete</p>
            </button>
          </div>
        </div>
      </div>

      <div class="pt-75 pb-10">
        <div
          class="border-5 rounded-xl font-['Inter'] mx-13 w-280 border-gray-300 py-5"
        >
          <div class="flex gap-5 pb-3">
            <img src="src/img/options.png" class="w-6 h-6 ml-6 mt-1" />
            <p id="detail-task-title" class="font-bold text-2xl"></p>
          </div>
          <div class="flex mx-17">
            <div
              class="text-[#2C6BF7] font-bold bg-[#E8F1FE] rounded-lg h-full"
            >
              <p id="detail-task-category" class="p-1 px-5"></p>
            </div>
            <div class="flex gap-3 mx-6">
              <img src="src/img/calendar.png" class="w-6 h-6 ml-3" />
              <p id="detail-task-due-date"></p>
            </div>
          </div>
          <p class="font-bold mx-6 pt-8 text-xl">Description</p>
          <p id="detail-task-description" class="mx-6 pt-2 pb-7"></p>

          <div class="w-265 border-1 border-gray-400 mx-auto"></div>

          <p class="font-bold mx-6 pt-7 text-xl">Reminder</p>
          <p id="detail-task-reminder" class="mx-6 pt-2 pb-3"></p>
        </div>
      </div>

      <div
        id="edit-task-modal"
        hidden
        class="fixed left-0 top-0 z-20 flex h-screen w-screen items-center justify-center bg-black/20 p-4"
        style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;"
      >
        <form
          id="edit-task-form"
          class="mx-auto max-h-[calc(100vh-2rem)] w-full max-w-md overflow-y-auto rounded-xl border-3 border-gray-300 bg-white p-3 shadow-xl"
        >
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold">Edit Task</h2>
            <button id="close-edit-task" type="button" class="text-3xl leading-none text-gray-500 hover:text-black">&times;</button>
          </div>
          <div class="mt-3 space-y-2">
            <label class="block font-bold">Title
              <input id="edit-title" name="title" required class="mt-1 w-full rounded-lg border-2 border-slate-200 p-2 font-normal" />
            </label>
            <label class="block font-bold">Description
              <textarea id="edit-description" name="description" rows="2" class="mt-1 w-full resize-none rounded-lg border-2 border-slate-200 p-2 font-normal"></textarea>
            </label>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
              <label class="block font-bold">Category
                <select id="edit-category" name="category" class="mt-1 w-full rounded-lg border-2 border-slate-200 bg-white p-2 font-normal">
                  <option value="">Select category...</option>
                  <option>Work</option>
                  <option>Personal</option>
                  <option>Study</option>
                </select>
              </label>
              <label class="block font-bold">Due Date
                <input id="edit-due-date" name="dueDate" type="date" class="mt-1 w-full rounded-lg border-2 border-slate-200 p-2 font-normal" />
              </label>
            </div>
            <label class="flex items-center gap-2 font-normal">
              <input id="edit-reminder" name="reminder" type="checkbox" class="h-5 w-5 accent-[#125FDD]" />
              Set reminder
            </label>
          </div>
          <div class="mt-3 flex justify-end gap-2">
            <button id="cancel-edit-task" type="button" class="rounded-lg border-3 border-gray-300 px-5 py-2 font-bold">Cancel</button>
            <button type="submit" class="rounded-lg bg-[#125FDD] px-5 py-2 font-bold text-white">Save Changes</button>
          </div>
        </form>
      </div>
    </section>
  </body>
    <script>
      const profileMenuButton = document.getElementById("profile-menu-button");
      const profileMenu = document.getElementById("profile-menu");
      const logoutButton = document.getElementById("logout-button");
      const taskTitle = document.getElementById("detail-task-title");
      const taskCategory = document.getElementById("detail-task-category");
      const taskDueDate = document.getElementById("detail-task-due-date");
      const taskDescription = document.getElementById("detail-task-description");
      const taskReminder = document.getElementById("detail-task-reminder");
      const deleteTaskButton = document.getElementById("delete-task-button");
      const editTaskButton = document.getElementById("edit-task-button");
      const editTaskModal = document.getElementById("edit-task-modal");
      const editTaskForm = document.getElementById("edit-task-form");
      const closeEditTask = document.getElementById("close-edit-task");
      const cancelEditTask = document.getElementById("cancel-edit-task");
      const editTitle = document.getElementById("edit-title");
      const editDescription = document.getElementById("edit-description");
      const editCategory = document.getElementById("edit-category");
      const editDueDate = document.getElementById("edit-due-date");
      const editReminder = document.getElementById("edit-reminder");

      const selectedTaskTitle = new URLSearchParams(window.location.search).get(
        "task",
      );
      const savedTasks = JSON.parse(localStorage.getItem("taskMTasks") || "[]");
      const selectedTask = savedTasks.find(
        (task) => task.title === selectedTaskTitle,
      );

      if (selectedTask) {
        taskTitle.textContent = selectedTask.title;
        taskCategory.textContent = selectedTask.category || "Uncategorized";
        taskDueDate.textContent = selectedTask.dueDate || "No due date";
        taskDescription.textContent =
          selectedTask.description || "No description added.";
        taskReminder.textContent = selectedTask.reminder
          ? "Reminder is enabled."
          : "No reminder set.";

        editTitle.value = selectedTask.title;
        editDescription.value = selectedTask.description || "";
        editCategory.value = selectedTask.category || "";
        editDueDate.value = selectedTask.dueDate || "";
        editReminder.checked = Boolean(selectedTask.reminder);
      }

      const closeEditModal = () => {
        editTaskModal.hidden = true;
        document.body.classList.remove("overflow-hidden");
      };

      editTaskButton.addEventListener("click", () => {
        if (!selectedTask) return;
        editTaskModal.hidden = false;
        document.body.classList.add("overflow-hidden");
        editTitle.focus();
      });
      closeEditTask.addEventListener("click", closeEditModal);
      cancelEditTask.addEventListener("click", closeEditModal);
      editTaskModal.addEventListener("click", (event) => {
        if (event.target === editTaskModal) closeEditModal();
      });

      editTaskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!selectedTask) return;

        const taskIndex = savedTasks.findIndex((task) =>
          selectedTask.id ? task.id === selectedTask.id : task.title === selectedTask.title,
        );
        if (taskIndex < 0) return;

        savedTasks[taskIndex] = {
          ...savedTasks[taskIndex],
          title: editTitle.value.trim(),
          description: editDescription.value.trim(),
          category: editCategory.value,
          dueDate: editDueDate.value,
          reminder: editReminder.checked,
        };
        localStorage.setItem("taskMTasks", JSON.stringify(savedTasks));
        window.location.href = `detailTasks.html?task=${encodeURIComponent(savedTasks[taskIndex].title)}`;
      });

      deleteTaskButton.addEventListener("click", async () => {
        if (!selectedTask) {
          return;
        }

        const shouldDelete = window.confirm(
          `Delete task "${selectedTask.title}"?`,
        );

        if (!shouldDelete) {
          return;
        }

        try {
          const response = await fetch(
            `/api/tasks/${encodeURIComponent(selectedTask.id)}`,
            { method: "DELETE" },
          );

          if (!response.ok) {
            throw new Error("Task gagal dihapus dari task.json");
          }

          const remainingTasks = savedTasks.filter(
            (task) => String(task.id) !== String(selectedTask.id),
          );
          localStorage.setItem("taskMTasks", JSON.stringify(remainingTasks));
          window.location.href = "dashboard.html";
        } catch (error) {
          window.alert(error.message);
        }
      });
      profileMenuButton.addEventListener("click", () => {
        const isOpen = !profileMenu.hidden;
        profileMenu.hidden = isOpen;
        profileMenuButton.setAttribute("aria-expanded", String(!isOpen));
      });
      document.addEventListener("click", (event) => {
        if (!profileMenuButton.contains(event.target) && !profileMenu.contains(event.target)) {
          profileMenu.hidden = true;
          profileMenuButton.setAttribute("aria-expanded", "false");
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          profileMenu.hidden = true;
          profileMenuButton.setAttribute("aria-expanded", "false");
        }
      });
      logoutButton.addEventListener("click", () => {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
